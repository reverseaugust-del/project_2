<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root {
    --bg: #eef2f6;
    --panel: #16324f;
    --panel-text: #e8eef5;
    --card: #ffffff;
    --text: #1b2733;
    --muted: #5d6b7a;
    --line: #c9d3dd;
    --accent: #1f6fb2;
    --accent-dark: #17578d;
    --error: #b3261e;
    --ok: #1e7a4c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .side {
    background: var(--panel);
    color: var(--panel-text);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px;
  }
  .side h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 12px; max-width: 14ch; }
  .side p { margin: 0; max-width: 36ch; line-height: 1.6; color: #b6c5d6; }
  .main { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 400px;
    padding: 36px 32px;
    border-radius: 10px;
    border: 1px solid var(--line);
  }
  .card h2 { margin: 0 0 6px; font-size: 1.5rem; }
  .card .sub { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: .9rem; font-weight: 600; margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid rgba(31, 111, 178, .4);
    outline-offset: 1px;
  }
  input.invalid { border-color: var(--error); }
  .toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--accent); font-size: .85rem;
    cursor: pointer; padding: 6px 8px;
  }
  .error { color: var(--error); font-size: .85rem; margin-top: 5px; min-height: 1em; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; font-size: .9rem; }
  .row label { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .submit {
    width: 100%; padding: 12px; font-size: 1rem; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; border-radius: 6px; cursor: pointer;
  }
  .submit:hover { background: var(--accent-dark); }
  .submit:disabled { opacity: .6; cursor: wait; }
  .status { margin-top: 16px; font-size: .9rem; min-height: 1.2em; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--error); }
  .foot { margin-top: 22px; text-align: center; font-size: .9rem; color: var(--muted); }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .side { padding: 28px 24px; }
    .side h1 { font-size: 1.5rem; max-width: none; }
  }
</style>
</head>
<body>
  <aside class="side">
    <h1>Welcome back to your account</h1>
    <p>Sign in to see your dashboard, update your details and pick up where you left off.</p>
  </aside>

  <main class="main">
    <div class="card">
      <h2>Sign in</h2>
      <p class="sub">Enter your email and password to continue.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <div class="error" id="emailError"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required minlength="8">
            <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
          </div>
          <div class="error" id="passwordError"></div>
        </div>

        <div class="row">
          <label><input type="checkbox" id="remember"> Keep me signed in</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="submit" id="submitBtn">Sign in</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>

      <p class="foot">New here? <a href="#">Create an account</a></p>
    </div>
  </main>

<script>
  const form = document.getElementById('loginForm');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const toggle = document.getElementById('toggle');

  toggle.addEventListener('click', () => {
    const hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    toggle.textContent = hidden ? 'Hide' : 'Show';
    toggle.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  });

  function validate() {
    let ok = true;
    emailError.textContent = passwordError.textContent = '';
    email.classList.remove('invalid');
    password.classList.remove('invalid');

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
      emailError.textContent = 'Enter a valid email address, like name@example.com.';
      email.classList.add('invalid');
      ok = false;
    }
    if (password.value.length < 8) {
      passwordError.textContent = 'Your password must be at least 8 characters.';
      password.classList.add('invalid');
      ok = false;
    }
    return ok;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'status';
    if (!validate()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    const payload = {
      email: email.value.trim(),
      password: password.value,
      remember: document.getElementById('remember').checked
    };

    try {
      // Replace '/api/login' with your real backend endpoint.
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Incorrect email or password.');
      statusEl.textContent = 'Signed in. Redirecting...';
      statusEl.classList.add('ok');
      // window.location.href = '/dashboard';
    } catch (err) {
      statusEl.textContent = err.message === 'Failed to fetch'
        ? 'Could not reach the server. Check your connection and try again.'
        : err.message;
      statusEl.classList.add('bad');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
